# Build the docs site the way it is published, then assert two things about the
# OUTPUT rather than about the source.
#
# Why this exists: nothing validated that this site builds. A bad Liquid tag in
# a layout does not fail loudly, it just stops publishing, and this site is
# investor-facing. A build that only runs after merge tells you too late.
#
# The second assertion is the one that matters over time. onchainbridges.com's
# privacy policy, clause 1.2 (d), and this site's own footer both state that
# these pages request nothing from a third party when loaded. That is an
# absolute claim in published legal text, and an absolute claim needs an
# instrument that keeps it true rather than a person remembering to re-check it.
#
# The first version of this check was a grep for nine known hosts. It passed
# while the site was in fact loading Google Fonts through an @import inside the
# theme's compiled stylesheet, because the grep only looked at markup. The
# checker now parses stylesheets and inline CSS as well as tags, asserts the
# general property instead of a denylist, and self-tests against fixtures that
# are supposed to fail. A check that cannot fail is not a check.
name: pages build check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The gate proves it can still fail BEFORE it is trusted to pass.
      - name: Self-test the third-party checker
        run: python3 scripts/check-no-third-party.py --self-test

      # The Gemfile is written here rather than committed, so there is only one
      # source of truth for what builds the site.
      - name: Install the github-pages gem
        run: |
          printf "source 'https://rubygems.org'\ngem 'github-pages', group: :jekyll_plugins\n" > Gemfile
          bundle install --quiet

      - name: Build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --destination _site --trace

      # Same step the publishing workflow runs, so this check reflects what is
      # actually deployed rather than an intermediate state.
      - name: Strip off-origin CSS imports
        run: python3 scripts/strip-remote-css-imports.py _site

      - name: The site actually rendered
        run: |
          test -f _site/index.html || { echo "no index.html was produced"; exit 1; }
          grep -q 'class="page-header"' _site/index.html \
            || { echo "index.html built but the page header is missing: the layout did not render"; exit 1; }
          test -f _site/assets/fonts/open-sans-latin.woff2 \
            || { echo "the self-hosted Open Sans woff2 is missing: the page would silently fall back"; exit 1; }
          grep -q 'assets/css/fonts.css' _site/index.html \
            || { echo "fonts.css is not linked: the self-hosted font would not be used"; exit 1; }
          grep -q 'site-footer-privacy' _site/index.html \
            || { echo "the footer privacy line is missing: the published privacy policy refers to it"; exit 1; }
          printf 'built %s pages\n' "$(find _site -name '*.html' | wc -l | tr -d ' ')"

      # WHICH QUESTION THIS ANSWERS, stated because getting it wrong is what
      # caused the incident this file exists for.
      #
      # This asserts on the artifact AFTER the strip step, and the strip is part
      # of the publishing pipeline: pages.yml runs the same build and the same
      # strip before it uploads. So a pass here describes what would be
      # published, not merely that the strip works.
      #
      # That was NOT true before the Pages source was switched from "deploy from
      # a branch" to "GitHub Actions". While GitHub built the site itself, this
      # job stripped a throwaway copy and went green while the served site kept
      # the @import. If the Pages source is ever switched back, this job stops
      # describing the live site and starts flattering it.
      - name: No third-party resource in the artifact this build would publish
        run: python3 scripts/check-no-third-party.py _site
